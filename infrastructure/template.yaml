  # ---------------------------------------------------------------- API Gateway REST
  EiraApi:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccountReady
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_120
            comment: Respuestas sensibles con Cache-Control no-store; la caché de API no debe usarse.
          - id: CKV_AWS_73
            comment: X-Ray se evaluará en la etapa de observabilidad (decisión 11).
          - id: CKV2_AWS_51
            comment: Certificados de cliente no aplican a una API pública para pacientes.
          - id: CKV2_AWS_29
            comment: WAF se asocia con WebACLAssociation bajo la condición CreateWaf (obligatoria en prod).
    Properties:
      Name: !Sub eira-${Stage}-api
      StageName: !Ref Stage
      OpenApiVersion: '3.0.1'
      EndpointConfiguration:
        Type: REGIONAL
      TracingEnabled: false
      CacheClusterEnabled: false
      Cors:
        AllowOrigin: !Sub "'https://${FrontendDistribution.DomainName}'"
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Authorization,Content-Type'"
        MaxAge: "'600'"
      AccessLogSetting:
        DestinationArn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ApiAccessLogGroup}
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime",
          "method":"$context.httpMethod","resource":"$context.resourcePath","status":"$context.status",
          "latencyMs":"$context.responseLatency","responseLength":"$context.responseLength",
          "wafStatus":"$context.waf.status","authorizerError":"$context.authorizer.error"}
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 100
          DataTraceEnabled: false
          LoggingLevel: 'OFF'
          MetricsEnabled: true
        - ResourcePath: '/~1v1~1access~1request'
          HttpMethod: 'POST'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
          DataTraceEnabled: false
          LoggingLevel: 'OFF'
          MetricsEnabled: true
        - ResourcePath: '/~1v1~1access~1resend'
          HttpMethod: 'POST'
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
          DataTraceEnabled: false
          LoggingLevel: 'OFF'
          MetricsEnabled: true
        - ResourcePath: '/~1v1~1access~1verify'
          HttpMethod: 'POST'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
          DataTraceEnabled: false
          LoggingLevel: 'OFF'
          MetricsEnabled: true
        - ResourcePath: '/~1v1~1access~1logout'
          HttpMethod: 'POST'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
          DataTraceEnabled: false
          LoggingLevel: 'OFF'
          MetricsEnabled: true
        - ResourcePath: '/~1v1~1results'
          HttpMethod: 'GET'
          ThrottlingRateLimit: 20
          ThrottlingBurstLimit: 40
          DataTraceEnabled: false
          LoggingLevel: 'OFF'
          MetricsEnabled: true
        - ResourcePath: '/~1v1~1results~1{resultId}~1download-url'
          HttpMethod: 'POST'
          ThrottlingRateLimit: 20
          ThrottlingBurstLimit: 40
          DataTraceEnabled: false
          LoggingLevel: 'OFF'
          MetricsEnabled: true
        - ResourcePath: '/~1v1~1admin~1patients'
          HttpMethod: 'POST'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
          DataTraceEnabled: false
          LoggingLevel: 'OFF'
          MetricsEnabled: true
        - ResourcePath: '/~1v1~1admin~1results'
          HttpMethod: 'POST'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
          DataTraceEnabled: false
          LoggingLevel: 'OFF'
          MetricsEnabled: true
        - ResourcePath: '/~1v1~1admin~1audit'
          HttpMethod: 'GET'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
          DataTraceEnabled: false
          LoggingLevel: 'OFF'
          MetricsEnabled: true
        - ResourcePath: '/v1~1admin~1patients'
          HttpMethod: 'GET'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
          DataTraceEnabled: false
          LoggingLevel: 'OFF'
          MetricsEnabled: true
        - ResourcePath: '/v1~1admin~1patients~1{patientId}'
          HttpMethod: 'GET'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
          DataTraceEnabled: false
          LoggingLevel: 'OFF'
          MetricsEnabled: true
        - ResourcePath: '/v1~1admin~1patients~1{patientId}~1results'
          HttpMethod: 'GET'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
          DataTraceEnabled: false
          LoggingLevel: 'OFF'
          MetricsEnabled: true
        - ResourcePath: '/v1~1admin~1results~1{resultId}~1upload-url'
          HttpMethod: 'POST'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
          DataTraceEnabled: false
          LoggingLevel: 'OFF'
          MetricsEnabled: true
        - ResourcePath: '/v1~1admin~1results~1{resultId}~1submit'
          HttpMethod: 'POST'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
          DataTraceEnabled: false
          LoggingLevel: 'OFF'
          MetricsEnabled: true
        - ResourcePath: '/v1~1admin~1results~1{resultId}~1review'
          HttpMethod: 'POST'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
          DataTraceEnabled: false
          LoggingLevel: 'OFF'
          MetricsEnabled: true
        - ResourcePath: '/v1~1admin~1results~1{resultId}~1review-url'
          HttpMethod: 'POST'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
          DataTraceEnabled: false
          LoggingLevel: 'OFF'
          MetricsEnabled: true
      Auth:
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          SessionAuthorizer:
            FunctionArn: !GetAtt SessionAuthorizerFunction.Arn
            FunctionPayloadType: REQUEST
            Identity:
              Headers: [Authorization]
              ReauthorizeEvery: 0
          CognitoAuthorizer:
            UserPoolArn: !GetAtt AdminUserPool.Arn
            Identity:
              Header: Authorization
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'https://${FrontendDistribution.DomainName}'"
              Cache-Control: "'no-store'"
          ResponseTemplates:
            application/json: '{"message":"Solicitud no válida"}'
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'https://${FrontendDistribution.DomainName}'"
              Cache-Control: "'no-store'"
          ResponseTemplates:
            application/json: '{"message":"Error interno"}'
      Tags:
        Project: eira-resultados
        Stage: !Ref Stage

  # ---------------------------------------------------------------- WAF regional (obligatorio en prod)
  ApiWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: CreateWaf
    Metadata:
      checkov:
        skip:
          - id: CKV2_AWS_31
            comment: Logs de WAF fuera de la etapa 1 por costo (decisión 8); métricas activas, muestras desactivadas para no retener encabezados con tokens.
    Properties:
      Name: !Sub eira-${Stage}-api
      Description: Managed rules and per-IP rate limits for the REST API
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      CustomResponseBodies:
        TooManyRequests:
          ContentType: APPLICATION_JSON
          Content: '{"message":"Demasiadas solicitudes"}'
      VisibilityConfig:
        SampledRequestsEnabled: false
        CloudWatchMetricsEnabled: true
        MetricName: !Sub eira-${Stage}-api
      Rules:
        - Name: AWSManagedRulesAmazonIpReputationList
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: false
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesAmazonIpReputationList
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: false
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesKnownBadInputsRuleSet
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 2
          OverrideAction: !If [IsDev, { Count: {} }, { None: {} }]
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: false
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesCommonRuleSet
        - Name: AccessRequestPerIp
          Priority: 3
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: TooManyRequests
          Statement:
            RateBasedStatement:
              Limit: 20
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                OrStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch:
                          UriPath: {}
                        PositionalConstraint: CONTAINS
                        SearchString: /v1/access/request
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
                    - ByteMatchStatement:
                        FieldToMatch:
                          UriPath: {}
                        PositionalConstraint: CONTAINS
                        SearchString: /v1/access/resend
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: false
            CloudWatchMetricsEnabled: true
            MetricName: AccessRequestPerIp
        - Name: AccessVerifyPerIp
          Priority: 4
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: TooManyRequests
          Statement:
            RateBasedStatement:
              Limit: 30
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch:
                    UriPath: {}
                  PositionalConstraint: CONTAINS
                  SearchString: /v1/access/verify
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: false
            CloudWatchMetricsEnabled: true
            MetricName: AccessVerifyPerIp
        - Name: GlobalPerIp
          Priority: 5
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: TooManyRequests
          Statement:
            RateBasedStatement:
              Limit: 500
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: false
            CloudWatchMetricsEnabled: true
            MetricName: GlobalPerIp
      Tags:
        - Key: Project
          Value: eira-resultados

  ApiWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: CreateWaf
    Properties:
      ResourceArn: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${EiraApi}/stages/${EiraApi.Stage}
      WebACLArn: !GetAtt ApiWebAcl.Arn

Outputs:
  ApiUrl:
    Description: URL base de la API REST
    Value: !Sub https://${EiraApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  FrontendUrl:
    Description: URL de CloudFront del frontend
    Value: !Sub https://${FrontendDistribution.DomainName}
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
  UserPoolId:
    Value: !Ref AdminUserPool
  UserPoolClientId:
    Value: !Ref AdminUserPoolClient
  CognitoDomain:
    Value: !Sub https://${AdminUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  PatientsTableName:
    Value: !Ref PatientsTable
  PinChallengesTableName:
    Value: !Ref PinChallengesTable
  AccessSessionsTableName:
    Value: !Ref AccessSessionsTable
  ResultsTableName:
    Value: !Ref ResultsTable
  AuditLogTableName:
    Value: !Ref AuditLogTable
  WebAclArn:
    Condition: CreateWaf
    Value: !GetAtt ApiWebAcl.Arn
