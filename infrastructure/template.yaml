    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub eira-${Stage}-app-admin-forbidden
      AlarmDescription: Usuario de Cognito sin grupo admins intentó acceder
      AlarmActions: [!Ref OpsAlarmsTopic]
      OKActions: [!Ref OpsAlarmsTopic]
      TreatMissingData: notBreaching
      Namespace: EiraResultados
      MetricName: AdminForbidden
      Dimensions:
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
  OpsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub eira-${Stage}-operacion
      DashboardBody: !Sub '{"widgets":[{"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"API: solicitudes y errores","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["AWS/ApiGateway","Count","ApiName","eira-${Stage}-api","Stage","${Stage}"],["AWS/ApiGateway","4XXError","ApiName","eira-${Stage}-api","Stage","${Stage}"],["AWS/ApiGateway","5XXError","ApiName","eira-${Stage}-api","Stage","${Stage}"]]}},{"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"API: latencia p99 (ms)","region":"${AWS::Region}","stat":"p99","period":300,"metrics":[["AWS/ApiGateway","Latency","ApiName","eira-${Stage}-api","Stage","${Stage}"]]}},{"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Lambda: errores","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["AWS/Lambda","Errors","FunctionName","${AccessRequestFunction}"],["AWS/Lambda","Errors","FunctionName","${AccessResendFunction}"],["AWS/Lambda","Errors","FunctionName","${AccessVerifyFunction}"],["AWS/Lambda","Errors","FunctionName","${AccessLogoutFunction}"],["AWS/Lambda","Errors","FunctionName","${SessionAuthorizerFunction}"],["AWS/Lambda","Errors","FunctionName","${ListResultsFunction}"],["AWS/Lambda","Errors","FunctionName","${DownloadUrlFunction}"],["AWS/Lambda","Errors","FunctionName","${AdminPatientsFunction}"],["AWS/Lambda","Errors","FunctionName","${AdminResultsFunction}"],["AWS/Lambda","Errors","FunctionName","${AdminReviewUrlFunction}"],["AWS/Lambda","Errors","FunctionName","${AdminAuditFunction}"]]}},{"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Lambda: duración p99 (ms)","region":"${AWS::Region}","stat":"p99","period":300,"metrics":[["AWS/Lambda","Duration","FunctionName","${AccessRequestFunction}",{"stat":"p99"}],["AWS/Lambda","Duration","FunctionName","${AccessResendFunction}",{"stat":"p99"}],["AWS/Lambda","Duration","FunctionName","${AccessVerifyFunction}",{"stat":"p99"}],["AWS/Lambda","Duration","FunctionName","${AccessLogoutFunction}",{"stat":"p99"}],["AWS/Lambda","Duration","FunctionName","${SessionAuthorizerFunction}",{"stat":"p99"}],["AWS/Lambda","Duration","FunctionName","${ListResultsFunction}",{"stat":"p99"}],["AWS/Lambda","Duration","FunctionName","${DownloadUrlFunction}",{"stat":"p99"}],["AWS/Lambda","Duration","FunctionName","${AdminPatientsFunction}",{"stat":"p99"}],["AWS/Lambda","Duration","FunctionName","${AdminResultsFunction}",{"stat":"p99"}],["AWS/Lambda","Duration","FunctionName","${AdminReviewUrlFunction}",{"stat":"p99"}],["AWS/Lambda","Duration","FunctionName","${AdminAuditFunction}",{"stat":"p99"}]]}},{"type":"metric","x":0,"y":12,"width":12,"height":6,"properties":{"title":"DynamoDB: throttling","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["AWS/DynamoDB","ReadThrottleEvents","TableName","${PatientsTable}"],["AWS/DynamoDB","WriteThrottleEvents","TableName","${PatientsTable}"],["AWS/DynamoDB","ReadThrottleEvents","TableName","${PinChallengesTable}"],["AWS/DynamoDB","WriteThrottleEvents","TableName","${PinChallengesTable}"],["AWS/DynamoDB","ReadThrottleEvents","TableName","${AccessSessionsTable}"],["AWS/DynamoDB","WriteThrottleEvents","TableName","${AccessSessionsTable}"],["AWS/DynamoDB","ReadThrottleEvents","TableName","${ResultsTable}"],["AWS/DynamoDB","WriteThrottleEvents","TableName","${ResultsTable}"],["AWS/DynamoDB","ReadThrottleEvents","TableName","${AuditLogTable}"],["AWS/DynamoDB","WriteThrottleEvents","TableName","${AuditLogTable}"]]}},{"type":"metric","x":12,"y":12,"width":12,"height":6,"properties":{"title":"WAF: bloqueadas","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["AWS/WAFV2","BlockedRequests","WebACL","eira-${Stage}-api","Region","${AWS::Region}","Rule","ALL"]]}},{"type":"metric","x":0,"y":18,"width":12,"height":6,"properties":{"title":"Aplicación (conteos, sin datos personales)","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["EiraResultados","AuditWriteFailed","Stage","${Stage}"],["EiraResultados","SmsSendFailed","Stage","${Stage}"],["EiraResultados","NonSyntheticRecordInDemo","Stage","${Stage}"],["EiraResultados","ResponseFloorExceeded","Stage","${Stage}"],["EiraResultados","PinChallengeLocked","Stage","${Stage}"],["EiraResultados","DownloadDenied","Stage","${Stage}"],["EiraResultados","AdminForbidden","Stage","${Stage}"],["EiraResultados","PinVerifyFailed","Stage","${Stage}"]]}}]}'

  # ---------------------------------------------------------------- Registro de cumplimiento (solo prod)
  WafLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateWafLogs
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub aws-waf-logs-eira-${Stage}
      RetentionInDays: 90
      KmsKeyId: !GetAtt OpsKey.Arn

  WafLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Condition: CreateWafLogs
    Properties:
      ResourceArn: !GetAtt ApiWebAcl.Arn
      LogDestinationConfigs:
        - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${WafLogGroup}
      RedactedFields:
        - SingleHeader:
            Name: authorization
        - SingleHeader:
            Name: cookie
        - QueryString: {}
      LoggingFilter:
        DefaultBehavior: DROP
        Filters:
          - Behavior: KEEP
            Requirement: MEETS_ANY
            Conditions:
              - ActionCondition:
                  Action: BLOCK
              - ActionCondition:
                  Action: COUNT

  AccessLogsBucket:
    Type: AWS::S3::Bucket
    Condition: CreateS3AccessLogs
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Es el destino de los logs de acceso; registrarse a sí mismo crearía un bucle.
          - id: CKV_AWS_144
            comment: Replicación entre regiones fuera del alcance del MVP.
          - id: CKV_AWS_145
            comment: S3 server access logging solo admite destino con SSE-S3 (no SSE-KMS).
          - id: CKV2_AWS_62
            comment: Sin consumidores de eventos.
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 365
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      Tags:
        - Key: Project
          Value: eira-resultados

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateS3AccessLogs
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3ServerAccessLogsOnly
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${AccessLogsBucket.Arn}/*
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  - !GetAtt DocumentsBucket.Arn
                  - !GetAtt FrontendBucket.Arn
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt AccessLogsBucket.Arn
              - !Sub ${AccessLogsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  ComplianceLogsBucket:
    Type: AWS::S3::Bucket
    Condition: CreateComplianceBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Bucket de registro (CloudTrail y Config); su acceso queda en los eventos de gestión de CloudTrail de la cuenta.
          - id: CKV_AWS_144
            comment: Replicación entre regiones fuera del alcance del MVP.
          - id: CKV2_AWS_62
            comment: Sin consumidores de eventos.
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt OpsKey.Arn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireComplianceLogs
            Status: Enabled
            ExpirationInDays: 400
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      Tags:
        - Key: Project
          Value: eira-resultados

  ComplianceLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateComplianceBucket
    Properties:
      Bucket: !Ref ComplianceLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt ComplianceLogsBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/eira-${Stage}-data-events
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${ComplianceLogsBucket.Arn}/cloudtrail/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/eira-${Stage}-data-events
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ComplianceLogsBucket.Arn
              - !Sub ${ComplianceLogsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  DataEventsTrail:
    Type: AWS::CloudTrail::Trail
    Condition: CreateDataEventsTrail
    DependsOn: ComplianceLogsBucketPolicy
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_67
            comment: Trail regional y solo de eventos de datos de los recursos de EIRA; los eventos de gestión los cubre el trail de la cuenta.
          - id: CKV_AWS_252
            comment: Sin notificación SNS por archivo; SNS se reserva para alarmas operativas.
          - id: CKV2_AWS_10
            comment: Se consulta desde S3 (Athena); enviar a CloudWatch Logs duplicaría costo.
    Properties:
      TrailName: !Sub eira-${Stage}-data-events
      S3BucketName: !Ref ComplianceLogsBucket
      S3KeyPrefix: cloudtrail
      KMSKeyId: !GetAtt OpsKey.Arn
      IsLogging: true
      IsMultiRegionTrail: false
      IncludeGlobalServiceEvents: false
      EnableLogFileValidation: true
      AdvancedEventSelectors:
        - Name: Objetos del bucket de documentos
          FieldSelectors:
            - Field: eventCategory
              Equals: [Data]
            - Field: resources.type
              Equals: [AWS::S3::Object]
            - Field: resources.ARN
              StartsWith:
                - !Sub ${DocumentsBucket.Arn}/
        - Name: Tablas con datos de pacientes, resultados y auditoria
          FieldSelectors:
            - Field: eventCategory
              Equals: [Data]
            - Field: resources.type
              Equals: [AWS::DynamoDB::Table]
            - Field: resources.ARN
              Equals:
                - !GetAtt PatientsTable.Arn
                - !GetAtt ResultsTable.Arn
                - !GetAtt AuditLogTable.Arn
      Tags:
        - Key: Project
          Value: eira-resultados

  ConfigRecorderRole:
    Type: AWS::IAM::Role
    Condition: CreateAwsConfig
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWS_ConfigRole
      Policies:
        - PolicyName: deliver-to-compliance-bucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${ComplianceLogsBucket.Arn}/config/AWSLogs/${AWS::AccountId}/*
              - Effect: Allow
                Action: s3:GetBucketAcl
                Resource: !GetAtt ComplianceLogsBucket.Arn
              # La S3 Bucket Key del bucket de cumplimiento requiere Decrypt además de GenerateDataKey.
              - Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:Decrypt
                Resource: !GetAtt OpsKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub s3.${AWS::Region}.amazonaws.com

  ConfigRecorder:
    Type: AWS::Config::ConfigurationRecorder
    Condition: CreateAwsConfig
    Properties:
      Name: !Sub eira-${Stage}
      RoleARN: !GetAtt ConfigRecorderRole.Arn
      RecordingGroup:
        AllSupported: false
        IncludeGlobalResourceTypes: false
        ResourceTypes:
          - AWS::S3::Bucket
          - AWS::DynamoDB::Table
          - AWS::KMS::Key
          - AWS::IAM::Role
          - AWS::Lambda::Function
          - AWS::ApiGateway::RestApi
          - AWS::ApiGateway::Stage
          - AWS::WAFv2::WebACL
          - AWS::CloudTrail::Trail
          - AWS::SNS::Topic
      RecordingMode:
        RecordingFrequency: DAILY

  ConfigDeliveryChannel:
    Type: AWS::Config::DeliveryChannel
    Condition: CreateAwsConfig
    # AWS Config exige que el grabador exista antes de aceptar el canal de entrega.
    DependsOn: ConfigRecorder
    Properties:
      Name: !Sub eira-${Stage}
      S3BucketName: !Ref ComplianceLogsBucket
      S3KeyPrefix: config
      S3KmsKeyArn: !GetAtt OpsKey.Arn
      ConfigSnapshotDeliveryProperties:
        DeliveryFrequency: TwentyFour_Hours

  ConfigRuleS3SslOnly:
    Type: AWS::Config::ConfigRule
    Condition: CreateAwsConfig
    DependsOn: [ConfigRecorder, ConfigDeliveryChannel]
    Properties:
      ConfigRuleName: !Sub eira-${Stage}-s3-bucket-ssl-requests-only
      Source:
        Owner: AWS
        SourceIdentifier: S3_BUCKET_SSL_REQUESTS_ONLY

  ConfigRuleS3PublicAccess:
    Type: AWS::Config::ConfigRule
    Condition: CreateAwsConfig
    DependsOn: [ConfigRecorder, ConfigDeliveryChannel]
    Properties:
      ConfigRuleName: !Sub eira-${Stage}-s3-bucket-level-public-access-prohibited
      Source:
        Owner: AWS
        SourceIdentifier: S3_BUCKET_LEVEL_PUBLIC_ACCESS_PROHIBITED

  ConfigRuleDynamoDbPitr:
    Type: AWS::Config::ConfigRule
    Condition: CreateAwsConfig
    DependsOn: [ConfigRecorder, ConfigDeliveryChannel]
    Properties:
      ConfigRuleName: !Sub eira-${Stage}-dynamodb-pitr-enabled
      Source:
        Owner: AWS
        SourceIdentifier: DYNAMODB_PITR_ENABLED

  ConfigRuleKmsRotation:
    Type: AWS::Config::ConfigRule
    Condition: CreateAwsConfig
    DependsOn: [ConfigRecorder, ConfigDeliveryChannel]
    Properties:
      ConfigRuleName: !Sub eira-${Stage}-cmk-backing-key-rotation-enabled
      Source:
        Owner: AWS
        SourceIdentifier: CMK_BACKING_KEY_ROTATION_ENABLED

Outputs:
  ApiUrl:
    Description: URL base de la API REST
    Value: !Sub https://${EiraApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  FrontendUrl:
    Description: URL de CloudFront del frontend
    Value: !Sub https://${FrontendDistribution.DomainName}
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
  UserPoolId:
    Value: !Ref AdminUserPool
  UserPoolClientId:
    Value: !Ref AdminUserPoolClient
  CognitoDomain:
    Value: !Sub https://${AdminUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  PatientsTableName:
    Value: !Ref PatientsTable
  PinChallengesTableName:
    Value: !Ref PinChallengesTable
  AccessSessionsTableName:
    Value: !Ref AccessSessionsTable
  ResultsTableName:
    Value: !Ref ResultsTable
  AuditLogTableName:
    Value: !Ref AuditLogTable
  WebAclArn:
    Condition: CreateWaf
    Value: !GetAtt ApiWebAcl.Arn
  OpsAlarmsTopicArn:
    Description: Tema SNS de alarmas operativas (sin suscripciones en la plantilla)
    Value: !Ref OpsAlarmsTopic
  OpsDashboardName:
    Value: !Ref OpsDashboard
