  AccessRequestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub eira-${Stage}-access-request
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: access-request
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt AccessRequestLogGroup.Arn
              - Sid: FindPatientByFolio
                Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub ${PatientsTable.Arn}/index/FolioHashIndex
              - Sid: ReadPatient
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt PatientsTable.Arn
              - Sid: PatientRateLimitCounterOnly
                Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt PatientsTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:Attributes: [patientId, pinWindowStartsAt, pinRequestCount]
                  StringEqualsIfExists:
                    dynamodb:ReturnValues: [NONE, UPDATED_NEW]
              - Sid: CreateChallenge
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt PinChallengesTable.Arn
              - Sid: AppendAudit
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt AuditLogTable.Arn
                Condition:
                  StringEqualsIfExists:
                    dynamodb:ReturnValues: NONE
              - Sid: UseDataKeyViaDynamoDB
                Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub dynamodb.${AWS::Region}.amazonaws.com
              - Sid: ReadSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref IdentityHmacSecret, !Ref PinHmacSecret]
              - Sid: DecryptSecrets
                Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt DataKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com

