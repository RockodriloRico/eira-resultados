    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub eira-${Stage}-admin-spa
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: !If
        - IsProd
        - [!Sub 'https://${FrontendDistribution.DomainName}/admin/callback']
        - [
            !Sub 'https://${FrontendDistribution.DomainName}/admin/callback',
            'http://localhost:5173/admin/callback',
          ]
      LogoutURLs: !If
        - IsProd
        - [!Sub 'https://${FrontendDistribution.DomainName}/admin']
        - [!Sub 'https://${FrontendDistribution.DomainName}/admin', 'http://localhost:5173/admin']
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 8
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: hours
      AuthSessionValidity: 3
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

