  # ---------------------------------------------------------------- Lambda (esqueletos sin lógica de negocio)
  AccessRequestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Sin concurrencia reservada en el MVP; el throttling de API Gateway acota la carga (decisión 10).
          - id: CKV_AWS_116
            comment: Invocación síncrona desde API Gateway; una DLQ no aplica.
          - id: CKV_AWS_117
            comment: Solo usa servicios regionales con IAM y TLS; una VPC con NAT no aporta control (decisión 10).
          - id: CKV_AWS_173
            comment: Las variables de entorno no contienen secretos (solo nombres y ARN).
          - id: CKV_AWS_272
            comment: Firma de código se evaluará antes del primer despliegue.
    Properties:
      FunctionName: !Sub eira-${Stage}-access-request
      Handler: accessRequest.handler
      Role: !GetAtt AccessRequestRole.Arn
      LoggingConfig:
        LogGroup: !Ref AccessRequestLogGroup
      Environment:
        Variables:
          PATIENTS_TABLE: !Ref PatientsTable
          PIN_CHALLENGES_TABLE: !Ref PinChallengesTable
          AUDIT_LOG_TABLE: !Ref AuditLogTable
          IDENTITY_HMAC_SECRET_ARN: !Ref IdentityHmacSecret
          PIN_HMAC_SECRET_ARN: !Ref PinHmacSecret
          SMS_PROVIDER: !Ref SmsProvider
          DEMO_PIN_ENABLED: !If [ExposeDemoPin, 'true', 'false']
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref EiraApi
            Path: /v1/access/request
            Method: post

  AccessResendFunction:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
