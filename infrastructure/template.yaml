AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  EIRA Resultados - infraestructura (etapa 1). Solo definición: este repositorio no despliega
  ningún recurso sin aprobación explícita.

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, demo, prod]
    Description: Entorno. Cada entorno es un stack aislado.
  SmsProvider:
    Type: String
    AllowedValues: [mock, sns]
    Default: mock
    Description: Proveedor de SMS. 'sns' es solo configuración futura; no hay integración real.
  EnableWaf:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Crea el Web ACL regional. En prod siempre se crea (Rules + Conditions).
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])$'
    Description: Prefijo del dominio de Cognito (globalmente único).
  ManageApiGatewayAccountRole:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >-
      Crea AWS::ApiGateway::Account (ajuste único por cuenta y región) para los access logs.
      Activar solo si la cuenta no tiene ya un rol de CloudWatch para API Gateway.

Mappings:
  StageConfig:
    dev:
      LogRetentionDays: 14
      DeletionProtection: 'false'
      CognitoDeletionProtection: INACTIVE
      DataClassification: SYNTHETIC
    demo:
      LogRetentionDays: 30
      DeletionProtection: 'false'
      CognitoDeletionProtection: INACTIVE
      DataClassification: SYNTHETIC
    prod:
      LogRetentionDays: 365
      DeletionProtection: 'true'
      CognitoDeletionProtection: ACTIVE
      DataClassification: CONFIDENTIAL

Rules:
  ProdRequiresWaf:
    RuleCondition: !Equals [!Ref Stage, prod]
    Assertions:
      - Assert: !Equals [!Ref EnableWaf, 'true']
        AssertDescription: Stage=prod requiere EnableWaf=true
  ProdForbidsMockSms:
    RuleCondition: !Equals [!Ref Stage, prod]
    Assertions:
      - Assert: !Not [!Equals [!Ref SmsProvider, mock]]
        AssertDescription: Stage=prod no admite SmsProvider=mock

Conditions:
  IsProd: !Equals [!Ref Stage, prod]
  IsDev: !Equals [!Ref Stage, dev]
  CreateWaf: !Or [!Condition IsProd, !Equals [!Ref EnableWaf, 'true']]
  ExposeDemoPin: !And [!Equals [!Ref Stage, demo], !Equals [!Ref SmsProvider, mock]]
  CreateApiGatewayAccountRole: !Equals [!Ref ManageApiGatewayAccountRole, 'true']

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    CodeUri: ../backend/dist/
    Handler: notImplemented.handler
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
    Environment:
      Variables:
        STAGE: !Ref Stage
        NODE_OPTIONS: --enable-source-maps
        CORS_ALLOWED_ORIGIN: !Sub https://${FrontendDistribution.DomainName}
    Tags:
      Project: eira-resultados
      Stage: !Ref Stage

Resources:
  # ---------------------------------------------------------------- KMS
  DataKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub EIRA ${Stage} - DynamoDB, Secrets Manager y CloudWatch Logs
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: CloudWatchLogsEncryption
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: '*'
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/eira-${Stage}-*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/eira-${Stage}-*
      Tags:
        - Key: Project
          Value: eira-resultados
        - Key: Stage
          Value: !Ref Stage

  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/eira-${Stage}-data
      TargetKeyId: !Ref DataKey

  DocumentsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub EIRA ${Stage} - documentos de resultados en S3
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          # Descifran documentos solo la descarga de pacientes (APPROVED) y la revisión (PENDING_REVIEW).
          - Sid: DecryptOnlyByReaderRoles
            Effect: Deny
            Principal:
              AWS: '*'
            Action: kms:Decrypt
            Resource: '*'
            Condition:
              ArnNotEquals:
                aws:PrincipalArn:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/eira-${Stage}-download-url
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/eira-${Stage}-admin-review-url
          - Sid: GenerateDataKeyOnlyByAdminResultsRole
            Effect: Deny
            Principal:
              AWS: '*'
            Action: kms:GenerateDataKey*
            Resource: '*'
            Condition:
              ArnNotEquals:
                aws:PrincipalArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/eira-${Stage}-admin-results
      Tags:
        - Key: Project
          Value: eira-resultados
        - Key: Stage
          Value: !Ref Stage

  DocumentsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/eira-${Stage}-documents
      TargetKeyId: !Ref DocumentsKey

  # ---------------------------------------------------------------- Secrets Manager
  IdentityHmacSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV2_AWS_57
            comment: Pepper de identidad; rotarlo invalida los HMAC almacenados (ADR-0009).
    Properties:
      Name: !Sub eira/${Stage}/identity-hmac
      Description: Pepper HMAC para folio, nombre, fecha de nacimiento e IP. Generado por CloudFormation.
      KmsKeyId: !Ref DataKey
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  PinHmacSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV2_AWS_57
            comment: La rotación se definirá con la lógica del PIN (etapa 2); ver ADR-0009.
    Properties:
      Name: !Sub eira/${Stage}/pin-hmac
      Description: Secreto HMAC del PIN. Generado por CloudFormation.
      KmsKeyId: !Ref DataKey
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # ---------------------------------------------------------------- DynamoDB (5 tablas)
  PatientsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub eira-${Stage}-Patients
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: patientId
          AttributeType: S
        - AttributeName: folioHash
          AttributeType: S
      KeySchema:
        - AttributeName: patientId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: FolioHashIndex
          KeySchema:
            - AttributeName: folioHash
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      DeletionProtectionEnabled: !FindInMap [StageConfig, !Ref Stage, DeletionProtection]
      Tags:
        - Key: Project
          Value: eira-resultados
        - Key: DataClassification
          Value: !FindInMap [StageConfig, !Ref Stage, DataClassification]

  PinChallengesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_28
            comment: Datos efímeros (5 min) que no se restauran; PITR no aporta valor.
    Properties:
      TableName: !Sub eira-${Stage}-PinChallenges
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: challengeId
          AttributeType: S
      KeySchema:
        - AttributeName: challengeId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      DeletionProtectionEnabled: !FindInMap [StageConfig, !Ref Stage, DeletionProtection]
      Tags:
        - Key: Project
          Value: eira-resultados

  AccessSessionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_28
            comment: Sesiones efímeras (15 min) que no se restauran; PITR no aporta valor.
    Properties:
      TableName: !Sub eira-${Stage}-AccessSessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tokenHash
          AttributeType: S
      KeySchema:
        - AttributeName: tokenHash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      DeletionProtectionEnabled: !FindInMap [StageConfig, !Ref Stage, DeletionProtection]
      Tags:
        - Key: Project
          Value: eira-resultados

  ResultsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub eira-${Stage}-Results
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: resultId
          AttributeType: S
        - AttributeName: patientId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: resultId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: PatientIndex
          KeySchema:
            - AttributeName: patientId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [resultType, status, sampleDate, availableAt]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      DeletionProtectionEnabled: !FindInMap [StageConfig, !Ref Stage, DeletionProtection]
      Tags:
        - Key: Project
          Value: eira-resultados
        - Key: DataClassification
          Value: !FindInMap [StageConfig, !Ref Stage, DataClassification]

  AuditLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub eira-${Stage}-AuditLog
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: eventType
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: EventTypeIndex
          KeySchema:
            - AttributeName: eventType
              KeyType: HASH
            - AttributeName: sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      DeletionProtectionEnabled: !FindInMap [StageConfig, !Ref Stage, DeletionProtection]
      ResourcePolicy:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: AppendOnlyItems
              Effect: Deny
              Principal:
                AWS: '*'
              Action:
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
                - dynamodb:PartiQLInsert
                - dynamodb:PartiQLUpdate
                - dynamodb:PartiQLDelete
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/eira-${Stage}-AuditLog
      Tags:
        - Key: Project
          Value: eira-resultados

  # ---------------------------------------------------------------- S3: documentos
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Logs de acceso de S3 y eventos de datos de CloudTrail quedan fuera de la etapa 1 (decisión 8).
          - id: CKV_AWS_144
            comment: Replicación entre regiones fuera del alcance del MVP.
          - id: CKV2_AWS_62
            comment: Sin consumidores de eventos en el MVP.
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt DocumentsKey.Arn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins:
              - !Sub https://${FrontendDistribution.DomainName}
            AllowedHeaders: [content-type, x-amz-*]
            MaxAge: 300
      Tags:
        - Key: Project
          Value: eira-resultados
        - Key: DataClassification
          Value: !FindInMap [StageConfig, !Ref Stage, DataClassification]

  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DocumentsBucket.Arn
              - !Sub ${DocumentsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: DenyNonKmsEncryption
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${DocumentsBucket.Arn}/*
            Condition:
              StringNotEqualsIfExists:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: DenyOtherKmsKeys
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${DocumentsBucket.Arn}/*
            Condition:
              StringNotEqualsIfExists:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt DocumentsKey.Arn
          # admin-results solo hace HeadObject (s3:GetObject) para verificar la carga: sin kms:Decrypt
          # no puede leer el contenido.
          - Sid: ReadOnlyByAuthorizedRoles
            Effect: Deny
            Principal: '*'
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub ${DocumentsBucket.Arn}/*
            Condition:
              ArnNotEquals:
                aws:PrincipalArn:
                  - !GetAtt DownloadUrlRole.Arn
                  - !GetAtt AdminReviewUrlRole.Arn
                  - !GetAtt AdminResultsRole.Arn
          - Sid: WriteOnlyByAdminResultsRole
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${DocumentsBucket.Arn}/*
            Condition:
              ArnNotEquals:
                aws:PrincipalArn: !GetAtt AdminResultsRole.Arn

  # ---------------------------------------------------------------- S3 + CloudFront: frontend
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Logs de acceso fuera de la etapa 1 (decisión 8).
          - id: CKV_AWS_144
            comment: Replicación entre regiones fuera del alcance del MVP.
          - id: CKV_AWS_145
            comment: Activos estáticos públicos vía CloudFront; SSE-S3 (decisión 3). OAC con SSE-KMS exigiría permisos KMS a CloudFront sin beneficio.
          - id: CKV2_AWS_62
            comment: Sin consumidores de eventos en el MVP.
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: eira-resultados

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub ${FrontendBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AllowCloudFrontOacRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub eira-${Stage}-frontend-oac
        Description: Acceso de CloudFront al bucket privado del frontend
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendSecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub eira-${Stage}-security-headers
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;
              connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com
              https://*.auth.${AWS::Region}.amazoncognito.com https://cognito-idp.${AWS::Region}.amazonaws.com
              https://*.s3.${AWS::Region}.amazonaws.com;
              frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_68
            comment: WAF en CloudFront fuera del MVP (decisión 9); solo sirve activos estáticos.
          - id: CKV_AWS_86
            comment: Logs de acceso de CloudFront fuera de la etapa 1 (decisión 8).
          - id: CKV_AWS_174
            comment: El certificado por defecto de CloudFront no permite fijar TLS mínimo; requiere dominio propio + ACM (decisión 9).
          - id: CKV_AWS_310
            comment: Grupo de orígenes con failover fuera del alcance del MVP.
          - id: CKV_AWS_374
            comment: Sin restricción geográfica; el servicio no limita por país.
    Properties:
      DistributionConfig:
        Comment: !Sub EIRA Resultados ${Stage} - frontend
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: FrontendS3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref FrontendSecurityHeaders
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: eira-resultados

  # ---------------------------------------------------------------- Cognito (administración)
  AdminUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub eira-${Stage}-admins
      UserPoolTier: ESSENTIALS
      DeletionProtection: !FindInMap [StageConfig, !Ref Stage, CognitoDeletionProtection]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Project: eira-resultados
        Stage: !Ref Stage

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub eira-${Stage}-admin-spa
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: !If
        - IsProd
        - [!Sub 'https://${FrontendDistribution.DomainName}/admin/callback']
        - [
            !Sub 'https://${FrontendDistribution.DomainName}/admin/callback',
            'http://localhost:5173/admin/callback',
          ]
      LogoutURLs: !If
        - IsProd
        - [!Sub 'https://${FrontendDistribution.DomainName}/admin']
        - [!Sub 'https://${FrontendDistribution.DomainName}/admin', 'http://localhost:5173/admin']
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 8
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: hours
      AuthSessionValidity: 3
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  AdminUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref AdminUserPool

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      Description: Personal autorizado de EIRA
      UserPoolId: !Ref AdminUserPool

  # ---------------------------------------------------------------- IAM: un rol por función
  AccessRequestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub eira-${Stage}-access-request
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: access-request
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt AccessRequestLogGroup.Arn
              - Sid: FindPatientByFolio
                Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub ${PatientsTable.Arn}/index/FolioHashIndex
              - Sid: ReadPatient
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt PatientsTable.Arn
              - Sid: PatientRateLimitCounterOnly
                Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt PatientsTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:Attributes: [patientId, pinWindowStartsAt, pinRequestCount]
                  StringEqualsIfExists:
